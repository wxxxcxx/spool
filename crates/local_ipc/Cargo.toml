[package]
name = "spool-local-ipc"
version = "0.4.4"
edition = "2024"
rust-version = "1.89.0"
description = "Authenticated, bounded Unix socket IPC for Spool."
license = "MIT"
publish = false

[lints.clippy]
pedantic = "warn"

[dependencies]
libc = "0.2"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { workspace = true }
spool-shared-types = { workspace = true }
