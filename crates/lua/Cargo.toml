[package]
name = "spool-lua"
version = "0.4.4"
edition = "2024"
rust-version = "1.89.0"
description = "The Spool Lua API: shared by the window manager's embedded runtime and, as a loadable module, by external scripts."
license = "MIT"
publish = false

# As a plain library this is what the daemon links against. With the `module`
# feature it additionally builds the `luaopen_spool` C extension that
# `require("spool")` loads.
[lib]
crate-type = ["rlib", "cdylib"]

[lints.clippy]
pedantic = "warn"

# `module` makes this a loadable LuaJIT module resolving the Lua C API from the
# host interpreter (no interpreter is embedded in the module). The daemon takes
# the default (no features) and supplies its vendored LuaJIT through its own
# `mlua` dependency.
[features]
default = []
module = ["mlua/module", "mlua/luajit"]

[dependencies]
mlua = { workspace = true }
spool-shared-types = { workspace = true, features = ["lua"] }
serde = { workspace = true }
# Decoding daemon query responses into Lua values.
serde_json = { workspace = true }
# `spool.match` compiles app/bundle/title patterns.
regex = { workspace = true }
spool-local-ipc.workspace = true
