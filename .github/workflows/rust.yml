name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - run: rustup update
    - run: rustup component add rustfmt clippy
    - name: Formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Tests (serial macOS FFI)
      run: cargo test --workspace --locked -- --test-threads=1
    - name: Build without Lua
      run: cargo check -p spool --no-default-features --locked

  build:
    needs: validate
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - run: rustup update
    - run: cargo build --release --locked --verbose
    - uses: actions/upload-artifact@v4
      with:
        name: spool-macos
        path: target/release/spool
